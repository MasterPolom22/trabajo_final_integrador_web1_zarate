<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/style.css" />
  <title>Contacto</title>
</head>

<body>
  <!-- Encabezado y navegacionm -->
  <header class="encabezado">
    <a href="index.html" class="logo"><img src="img/logo.png" alt="impulso 3d-sl logo" /></a>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="contacto.html" class="activo">Contacto</a>
    </nav>
  </header>

  <!-- Contenido principal -->

  <main>

    <section class="contacto">

      <h1>Contactanos</h1>

      <p>
        ¿Tenés una idea para imprimir en 3D?
        Completá el formulario y contanos tu proyecto.
      </p>

      <form id="formulario-contacto" novalidate>

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre">
          <span class="error" id="error-nombre"></span>
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email">
          <span class="error" id="error-email"></span>
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono">
          <span class="error" id="error-telefono"></span>
        </div>

        <div class="campo">
          <label for="mensaje">Contanos tu proyecto</label>
          <textarea id="mensaje" name="mensaje" rows="5"></textarea>
          <span class="error" id="error-mensaje"></span>
        </div>

        <button type="submit">Enviar consulta</button>

      </form>

      <div id="resultado-formulario"></div>

    </section>

  </main>


  <!-- Pie de página -->
  <footer class="pie-pagina">
    <div class="pie-contenido">
      <h2>Impulso 3D-SL</h2>
      <p>Impulsamos tus ideas en 3D.</p>
      <p>Impresiones 3D personalizadas para tus proyectos.</p>
    </div>

    <div class="pie-inferior">
      <p>&copy; 2026 Impulso 3D-SL. Todos los derechos reservados.</p>
    </div>
  </footer>


  <script src="js/formulario.js"></script>
</body>

</html>
